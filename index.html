<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BG Rooftop After Party Tickets</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #1f2833;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        h1 { color: #66fcf1; }
        p { font-size: 1.2em; line-height: 1.6; }
        .price {
            font-size: 2em;
            font-weight: bold;
            color: #45a29e;
            margin: 20px 0;
        }
        button {
            background-color: #66fcf1;
            color: #0b0c10;
            border: none;
            padding: 15px 30px;
            font-size: 1.5em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #45a29e; color: white; }
        #success-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #28a745;
            color: white;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE AFTER PARTY</h1>
        <p><strong>Venue:</strong> BG Rooftop Cafe<br>Safiyabad Road, Opp. Khemo Devi Public School, Narela, Delhi</p>
        <p>Music, Food, Drinks & Unforgettable Vibes.</p>
        
        <div class="price">₹1200 / Person</div>

        <button id="rzp-button1">Buy Ticket Now</button>

        <div id="success-message">
            <h3>Payment Successful!</h3>
            <p>Your Entry Code is: <br><strong id="ticket-code" style="font-size: 1.5em;"></strong></p>
            <p>Please screenshot this code and show it at the entrance.</p>
        </div>
    </div>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        var options = {
            "key": "YOUR_RAZORPAY_KEY_ID", // Enter your Razorpay Key ID here
            "amount": "120000", // Amount is in paise (1200 * 100)
            "currency": "INR",
            "name": "BG Rooftop After Party",
            "description": "1x Entry Ticket",
            "theme": {
                "color": "#66fcf1"
            },
            "handler": function (response){
                // This function runs when the payment is successful
                document.getElementById('rzp-button1').style.display = 'none';
                document.getElementById('success-message').style.display = 'block';
                
                // We use the Razorpay Payment ID as the unique ticket code
                document.getElementById('ticket-code').innerText = response.razorpay_payment_id;
            },
            "prefill": {
                "name": "", // User will fill this in the popup
                "email": "",
                "contact": ""
            }
        };
        var rzp1 = new Razorpay(options);
        document.getElementById('rzp-button1').onclick = function(e){
            rzp1.open();
            e.preventDefault();
        }
    </script>
</body>
</html>
